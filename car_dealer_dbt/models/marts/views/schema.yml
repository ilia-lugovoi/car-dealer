version: 2

models:
  - name: v_sessions
    description: "BI view by sessions. Grain: 1 row = 1 session."
    columns:
      - name: id
        description: "Session identifier."
        tests: [not_null, unique]
      - name: client_id
        description: "Client identifier."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_clients')
                field: client_id
      - name: medium
        description: "Marketing medium."
        tests:
          - relationships:
              arguments:
                to: ref('stg_mediums')
                field: medium_name
      - name: medium_group
        description: "High-level medium group for BI analysis."
      - name: sale
        description: "Sale flag from the session layer."
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: crm_sale
        description: "Sale flag from CRM events."
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: brand_name
        description: "Brand name from matched sale."
      - name: class_name
        description: "Class name from matched sale."
      - name: gross_profit_rub
        description: "Gross profit in RUB from matched sale."
      - name: contribution_margin_rub
        description: "Contribution margin in RUB from matched sale."

  - name: v_clients
    description: "BI view by clients. Grain: 1 row = 1 client_id."
    columns:
      - name: client_id
        description: "Client identifier."
        tests: [not_null, unique]
      - name: sessions_cnt
        description: "Number of sessions by client."
      - name: sales_cnt
        description: "Number of sales by client."
      - name: total_ad_cost
        description: "Total ad cost by client."
      - name: total_gross_profit_rub
        description: "Total gross profit in RUB by client."
      - name: total_contribution_margin_rub
        description: "Total contribution margin in RUB by client."

  - name: v_medium
    description: "Medium lookup view. Grain: 1 row = 1 medium."
    columns:
      - name: medium_name
        description: "Medium name."
        tests: [not_null, unique]
      - name: medium_group_id
        description: "Reference to the medium group."
      - name: medium_sort
        description: "Medium sort order for BI."

  - name: v_medium_groups
    description: "Medium groups lookup view. Grain: 1 row = 1 medium group."
    columns:
      - name: medium_group_name
        description: "Medium group name."
        tests: [not_null, unique]
      - name: medium_group_sort
        description: "Medium group sort order for BI."
