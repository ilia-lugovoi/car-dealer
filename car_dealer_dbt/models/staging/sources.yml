version: 2

sources:
  - name: raw
    schema: dbo
    description: "Raw tables loaded into MSSQL from Excel and project scripts."
    tables:
      - name: clients
        description: "Client lookup. Grain: 1 row = 1 client_id."
        columns:
          - name: client_id
            tests: [not_null, unique]
          - name: client_name
          - name: phone
          - name: city

      - name: crm_events
        description: "CRM events. Grain: 1 row = 1 CRM event."
        columns:
          - name: client_id
            tests: [not_null]
          - name: ga_session_id
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'ga_sessions')
                    field: id
          - name: crm_city
          - name: count_cost
          - name: dealer_meet
            tests:
              - accepted_values:
                  arguments:
                    values: [0, 1]
          - name: crm_sale
            tests:
              - accepted_values:
                  arguments:
                    values: [0, 1]
          - name: event_date
            tests: [not_null]

      - name: models
        description: "Car models lookup. Grain: 1 row = 1 model."
        columns:
          - name: id
            tests: [not_null, unique]
          - name: model_name
            tests: [not_null]
          - name: price_original
          - name: margin_pct
          - name: brand_id
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'brands')
                    field: id
          - name: class_id
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'classes')
                    field: id
          - name: currency_id
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'currencies')
                    field: id

      - name: brands
        description: "Car brands lookup. Grain: 1 row = 1 brand."
        columns:
          - name: id
            tests: [not_null, unique]
          - name: brand_name
            tests: [not_null, unique]

      - name: classes
        description: "Car classes lookup. Grain: 1 row = 1 class."
        columns:
          - name: id
            tests: [not_null, unique]
          - name: class_name
            tests: [not_null, unique]

      - name: currencies
        description: "Currencies lookup. Grain: 1 row = 1 currency."
        columns:
          - name: id
            tests: [not_null, unique]
          - name: currency_code
            tests:
              - not_null
              - unique
              - accepted_values:
                  arguments:
                    values: ['CNY', 'USD', 'EUR', 'RUB']

      - name: mediums
        description: "Mediums lookup. Grain: 1 row = 1 medium."
        columns:
          - name: medium_name
            tests: [not_null, unique]
          - name: medium_group_id
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'medium_groups')
                    field: id
          - name: medium_sort

      - name: medium_groups
        description: "Medium groups lookup. Grain: 1 row = 1 medium group."
        columns:
          - name: id
            tests: [not_null, unique]
          - name: medium_group_name
            tests: [not_null, unique]
          - name: medium_group_sort

      - name: sales
        description: "Sales table. Grain: 1 row = 1 sale."
        columns:
          - name: id
            tests: [not_null, unique]
          - name: client_id
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'clients')
                    field: client_id
          - name: sale_date
            tests: [not_null]
          - name: sale_city
          - name: model_id
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'models')
                    field: id

      - name: ga_sessions
        description: "GA sessions table. Grain: 1 row = 1 session."
        columns:
          - name: id
            tests: [not_null, unique]
          - name: client_id
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'clients')
                    field: client_id
          - name: medium
            tests:
              - relationships:
                  arguments:
                    to: source('raw', 'mediums')
                    field: medium_name
          - name: conversion
            tests:
              - accepted_values:
                  arguments:
                    values: [0, 1]
          - name: sale
            tests:
              - accepted_values:
                  arguments:
                    values: [0, 1]
          - name: model_ga_id
            tests:
              - relationships:
                  arguments:
                    to: source('raw', 'models')
                    field: id

      - name: currency_rates
        description: "CBR currency rates by date. Grain: 1 row = 1 currency_code + rate_date."
        columns:
          - name: rate_date
            tests: [not_null]
          - name: currency_code
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'currencies')
                    field: currency_code
          - name: nominal
          - name: rate_value
          - name: update_timestamp
