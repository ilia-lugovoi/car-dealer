version: 2

models:
  - name: int_sales_ranked
    description: "Sales with row_number inside client_id + sale_date. Grain: 1 row = 1 sale."
    columns:
      - name: id
        tests: [not_null, unique]
      - name: sale_rn
        tests: [not_null]

  - name: int_ga_sales_ranked
    description: "Sold GA sessions with row_number inside client_id + date. Grain: 1 row = 1 sold session."
    columns:
      - name: session_id
        tests: [not_null, unique]
      - name: sale_rn
        tests: [not_null]

  - name: int_sales_with_session
    description: "Sales matched to web sessions. Grain: 1 row = 1 sale."
    columns:
      - name: id
        tests: [not_null, unique]
      - name: client_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_clients')
                field: client_id
      - name: model_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_models')
                field: id

  - name: int_sales_enriched
    description: "Sales enriched with model, currency and rate on sale date. Grain: 1 row = 1 sale."
    columns:
      - name: id
        tests: [not_null, unique]
      - name: currency_code
        tests:
          - accepted_values:
              arguments:
                values: ['CNY', 'USD', 'EUR', 'RUB']

  - name: int_sales
    description: "Final sales intermediate layer with ad_cost, price_rub and gross_profit_rub. Grain: 1 row = 1 sale."
    columns:
      - name: id
        tests: [not_null, unique]
      - name: client_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_clients')
                field: client_id
      - name: model_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_models')
                field: id
      - name: currency_code
        tests:
          - accepted_values:
              arguments:
                values: ['CNY', 'USD', 'EUR', 'RUB']

  - name: int_models_with_currency
    description: "Models enriched with brand and currency code. Grain: 1 row = 1 model."
    columns:
      - name: id
        tests: [not_null, unique]
      - name: brand_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_brands')
                field: id
      - name: brand_name
        tests: [not_null]
      - name: class_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_classes')
                field: id
      - name: class_name
        tests: [not_null]
      - name: currency_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_currencies')
                field: id
      - name: currency_code
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['CNY', 'USD', 'EUR', 'RUB']

  - name: int_session_crm
    description: "Sessions enriched with CRM event fields by direct ga_session_id match. Grain: 1 row = 1 session."
    columns:
      - name: id
        tests: [not_null, unique]
      - name: client_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_clients')
                field: client_id
      - name: dealer_meet
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: crm_sale
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
