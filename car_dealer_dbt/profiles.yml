car_dealer_dbt:
  target: dev
  outputs:
    dev:
      type: sqlserver
      driver: "ODBC Driver 18 for SQL Server"
      server: host.docker.internal
      port: 1433
      database: car_dealer
      schema: dbo
      user: airflow
      password: airflow_pass
      encrypt: true
      trust_cert: true
      threads: 4